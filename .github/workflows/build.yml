name: Build and Deploy CardMax to AWS

on:
  push:
    branches:
      - v1/deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup latest version of PNPM
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: latest

      # 3. Setup Node.js 24 with PNPM caching
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      # 4. Create .env file for build step
      - name: Create .env File
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # 5. Install all dependencies (including devDependencies)
      - name: Install All Dependencies
        run: pnpm install

      # 6. Generate types
      - name: Generate Types
        run: pnpm gen

      # 7. Execute build
      - name: Create Build
        run: pnpm build

      # 8. Setup SSH Key for AWS Transfer
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # 9. Clear old .next build and copy new build output + package files to AWS
      - name: Sync Build Artifacts to AWS EC2
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

          # Remove old .next build on server prior to syncing new files
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "rm -rf /var/www/cardmax/.next"

          # Rsync built files, public directory, package.json, and lockfile
          rsync -avz \
            .next \
            public \
            package.json \
            pnpm-lock.yaml \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/var/www/cardmax/

      # 10. Install production dependencies on AWS and start/restart PM2 process
      - name: Install Production Dependencies & Start Process
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/cardmax

            # Load Node/PM2/PNPM environment into SSH session path
            export PATH=$PATH:~/.nvm/versions/node/$(node -v)/bin:~/.local/share/pnpm

            # Install ONLY production dependencies
            pnpm install --prod

            # Reload active process or start new PM2 instance if not running
            pm2 restart cardmax || pm2 start pnpm --name "cardmax" -- start
            pm2 save
