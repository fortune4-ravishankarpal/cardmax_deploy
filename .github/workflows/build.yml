name: Build and Deploy CardMax to AWS

on:
  push:
    branches:
      - v1/deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js 24 with NPM caching
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # 3. Create .env file for build step
      - name: Create .env File
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # 4. Install all dependencies (including devDependencies)
      - name: Install All Dependencies
        run: npm ci

      # 5. Generate types
      - name: Generate Types
        run: npm run gen

      # 6. Execute build
      - name: Create Build
        run: npm run build 

      # 7a. Setup SSH Key for Tunneling
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # 7b. Open SSH Tunnel, Run Migrations, Close Tunnel
      - name: Run Migrations via SSH Tunnel
        run: |
          # Add EC2 host to known hosts
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

          # Create background SSH tunnel (maps local port 5432 to EC2 port 5432)
          ssh -f -N -L 5432:127.0.0.1:5432 ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}

          # Run migration locally through the tunnel
          npm run mg

      # 8. Setup SSH Key for AWS Transfer
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # 9. Sync Build Artifacts, configuration, and package files to AWS
      - name: Sync Build Artifacts to AWS EC2
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "rm -rf /var/www/cardmax/.next"

          rsync -avz \
            .next \
            public \
            package.json \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/var/www/cardmax/

      # 10. Install production dependencies on AWS and start/restart PM2 process
      - name: Install Production Dependencies & Start Process
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Source shell environment files to load Node and PM2 paths
            [ -s "$HOME/.nvm/nvm.sh" ] && \. "$HOME/.nvm/nvm.sh"
            [ -s "$HOME/.profile" ] && \. "$HOME/.profile"
            [ -s "$HOME/.bashrc" ] && \. "$HOME/.bashrc"

            cd /var/www/cardmax

            # Install ONLY production dependencies
            npm ci --omit=dev

            # Reload active process or start new PM2 instance if not running
            pm2 restart cardmax || pm2 start npm --name "cardmax" -- start
            pm2 save
